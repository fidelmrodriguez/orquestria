# O frontend atual do Orquestria não utiliza rotas dinâmicas no servidor.
# Next.js gera arquivos estáticos em frontend/out durante o build.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Base definida como "frontend"; este diretório é relativo a essa base.
[functions]
  directory = "netlify/functions"
