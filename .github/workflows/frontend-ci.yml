name: Frontend Next.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - Next.js / TypeScript / Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar links internos da documentação
        run: node ../scripts/check-doc-links.mjs
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Rodar testes Jest
        run: npm test -- --runInBand --ci
      - name: Testar função de cold start sem CORS
        run: node --test tests/readiness-function.test.mjs
      - name: Validar build estático do Netlify
        run: npm run build
      - name: Conferir proxy de readiness e saída estática
        run: |
          test -f out/index.html
          test -f out/_redirects
          grep -Eq '^/api/orquestria-readiness[[:space:]]+/.netlify/functions/orquestria-readiness[[:space:]]+200!' out/_redirects
          test -f netlify/functions/orquestria-readiness.mjs
