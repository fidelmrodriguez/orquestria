spring:
  application:
    name: orquestria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orquestria}
    username: ${DB_USER:orquestria}
    password: ${DB_PASSWORD:orquestria}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"
  level:
    com.orquestria.api: INFO
